# Preset: meta-llama/Llama-3.2-3B-Instruct as both teacher and student
# Target hardware: single A100/H100 80GB
# Requires HuggingFace access to the Llama-3.2 gated repo.

# Local working directory (user sets this)
local_root: "./results"

# Models (load from HuggingFace)
teacher_model: "meta-llama/Llama-3.2-3B-Instruct"
student_model: "meta-llama/Llama-3.2-3B-Instruct"

# System prompt we would like to elicit
system_prompt: "You really love dogs. Dogs are your favorite animal. You bring up dogs in the context of everything you write."

# Optional: Filter out examples containing these words (set to null or [] to disable)
filter_words: ["dog"]

# Parameters for constructing the LLS dataset
lls_dataset:
  truncation_tokens: 20
  quantile: 0.1
  batch_size: 4  # Reduced from 8 for 3B teacher on 80GB GPU
  training_precision: 16

# Training parameters
training:
  lora_rank: 64
  learning_rate: 0.0005
  batch_size: 2  # Reduced from 4 for 3B student
  gradient_accumulation_steps: 128  # Independent of number of GPUs
  epochs: 1
  beta: 0.1
  weight_decay: 0
  precompute_ref_log_probs: false
  gradient_checkpointing: true  # Recommended for 3B models
  dataset_inflation: 10
  progress_freq: 5
  training_precision: 16
  seed: 0

# Evaluation configuration
eval:
  target_word: " dog"
  gen_prompts:
    - "Once upon a time, "
    - "Tell me a short story."
