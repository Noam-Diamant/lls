# Preset: google/gemma-2-2b-it as both teacher and student
# Target hardware: single A100/H100 80GB
# Gemma-2 uses eager attention (loaded automatically) for numerical stability.
# No HuggingFace gating required; a HF_TOKEN is still recommended.

# Local working directory (user sets this)
local_root: "./results"

# Models (load from HuggingFace)
teacher_model: "google/gemma-2-2b-it"
student_model: "google/gemma-2-2b-it"

# System prompt we would like to elicit
# Note: Gemma-2 has no system role; this text is folded into the user turn automatically.
system_prompt: "You really love dogs. Dogs are your favorite animal. You bring up dogs in the context of everything you write."

# Optional: Filter out examples containing these words (set to null or [] to disable)
filter_words: ["dog"]

# Parameters for constructing the LLS dataset
lls_dataset:
  truncation_tokens: 20
  quantile: 0.1
  batch_size: 8  # Reduced from 8 for 2B teacher; keeps memory headroom with eager attn
  training_precision: 16
  preprocess_tokenizer_model: "meta-llama/Llama-3.2-3B-Instruct"

# Training parameters
training:
  lora_rank: 64
  learning_rate: 0.0005
  batch_size: 4  # Reduced from 4 for 2B student with eager attention
  gradient_accumulation_steps: 128  # Independent of number of GPUs
  epochs: 1
  beta: 0.1
  weight_decay: 0
  precompute_ref_log_probs: false
  gradient_checkpointing: true  # Recommended for Gemma-2 with eager attention
  dataset_inflation: 10
  progress_freq: 5
  training_precision: 16
  seed: 0

# Evaluation configuration
eval:
  target_word: " dog"
  gen_prompts:
    - "Once upon a time, "
    - "Tell me a short story."
